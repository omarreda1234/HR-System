name: Build & Deploy to Production Windows Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Publish & Deploy HRSystem to Production Server (192.168.1.57)
    runs-on: [ self-hosted, Windows, X64 ]

    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Build & Publish Project
        shell: powershell
        run: |
          Write-Host "Publishing HRSystem in Release mode (win-x86)..."
          $publishDir = "$env:RUNNER_TEMP\publish_hr"
          if (Test-Path $publishDir) { Remove-Item -Recurse -Force $publishDir }
          
          # Publish targeting 32-bit x86 for ZKTeco COM SDK compatibility
          dotnet publish "HRSystem/HRSystem.csproj" -c Release -r win-x86 --self-contained false -o $publishDir
          
          if (!(Test-Path "$publishDir\HRSystem.exe")) {
            Write-Error "Build failed: HRSystem.exe not found in publish directory."
            exit 1
          }
          Write-Host "Publish successful."

      - name: Deploy to Production Server (192.168.1.57) & Restart Service
        shell: powershell
        run: |
          $prodTarget = "\\192.168.1.57\C$\HRSystem-prod"
          $source = "$env:RUNNER_TEMP\publish_hr"
          
          Write-Host "Stopping HRSystemService on Production Server (192.168.1.57)..."
          Invoke-Command -ComputerName "192.168.1.57" -ScriptBlock { 
            Stop-Service -Name "HRSystemService" -ErrorAction SilentlyContinue 
          }
          Start-Sleep -Seconds 3

          # Ensure target directory exists on 192.168.1.57
          if (!(Test-Path $prodTarget)) {
            New-Item -ItemType Directory -Path $prodTarget -Force | Out-Null
          }

          # Backup existing production appsettings.json to protect production DB settings
          $appSettingsBackup = "$prodTarget\appsettings.json.bak"
          if (Test-Path "$prodTarget\appsettings.json") {
            Copy-Item "$prodTarget\appsettings.json" $appSettingsBackup -Force
          }

          Write-Host "Copying updated files to Production Server ($prodTarget)..."
          Copy-Item "$source\*" $prodTarget -Recurse -Force

          # Restore production appsettings.json
          if (Test-Path $appSettingsBackup) {
            Copy-Item $appSettingsBackup "$prodTarget\appsettings.json" -Force
            Remove-Item $appSettingsBackup -Force
            Write-Host "Production appsettings.json preserved."
          }

          Write-Host "Starting HRSystemService on Production Server (192.168.1.57)..."
          Invoke-Command -ComputerName "192.168.1.57" -ScriptBlock { 
            Start-Service -Name "HRSystemService" 
          }
          Start-Sleep -Seconds 5

      - name: Verify Production Service Health
        shell: powershell
        run: |
          Write-Host "Checking Service Status on Production Server (192.168.1.57)..."
          $svcStatus = Invoke-Command -ComputerName "192.168.1.57" -ScriptBlock { 
            (Get-Service -Name "HRSystemService").Status 
          }
          Write-Host "Production HRSystemService Status: $svcStatus"
          if ($svcStatus -ne 'Running') {
            Write-Error "HRSystemService on 192.168.1.57 is not running!"
            exit 1
          }

          Write-Host "Checking Application Health on http://192.168.1.57:5051..."
          try {
            $resp = Invoke-RestMethod -Uri "http://192.168.1.57:5051/Home/GetAutoSyncStatus" -TimeoutSec 15
            Write-Host "Production System is UP & Healthy. Status: $($resp.status)"
          } catch {
            Write-Warning "Health endpoint took longer to respond, but Windows Service is active."
          }
